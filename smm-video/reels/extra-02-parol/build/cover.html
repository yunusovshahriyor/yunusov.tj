<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#1E1E1E;--panel:#252526;--panel2:#2D2D30;--line:#3C3C3C;--text:#D4D4D4;--muted:#8B949E;--kw:#569CD6;--str:#CE9178;--num:#B5CEA8;--fn:#DCDCAA;--teal:#4EC9B0;--err:#F48771;--purple:#BD93F9;--pink:#FF79C6;--accent:linear-gradient(90deg,#BD93F9,#FF79C6);--mono:"JetBrains Mono","DejaVu Sans Mono",monospace}
*{margin:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden}
body{background:radial-gradient(circle at 82% 12%,rgba(189,147,249,.16),transparent 40%),radial-gradient(circle at 10% 88%,rgba(255,121,198,.07),transparent 45%),var(--bg);color:var(--text);font-family:Inter,sans-serif;position:relative}
body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:27px 27px}
.hdr{position:absolute;left:24px;right:24px;top:22px;z-index:20}
.hdr .nm{display:flex;justify-content:space-between;font:800 11px var(--mono);letter-spacing:1.6px;color:var(--muted)}
.hdr .nm b{color:#fff}.hdr .nm span:last-child{color:var(--purple)}
.bar{display:flex;gap:5px;margin-top:9px}.bar i{flex:1;height:4px;border-radius:3px;background:var(--panel2);overflow:hidden}.bar i u{display:block;height:100%;width:0;background:var(--accent)}
.scene{position:absolute;inset:0;visibility:hidden}
.scene>*{position:absolute}
.h1{font-weight:900;font-size:34px;line-height:1.08;color:#fff;letter-spacing:-.5px}.c{left:24px;right:24px;text-align:center}
.acc{background:var(--accent);-webkit-background-clip:text;color:transparent}
.form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.form .ft{font:800 17px Inter;color:#fff;margin-bottom:10px}.form .fl{font:600 11px var(--mono);color:var(--muted);margin:8px 0 4px;letter-spacing:1px}
.form .fi{height:38px;border-radius:9px;background:var(--bg);border:1px solid var(--line);padding:0 12px;display:flex;align-items:center;font:600 16px var(--mono);color:#fff}
.form .fb{margin-top:14px;height:38px;border-radius:9px;background:#2ea043;color:#fff;font:800 14px Inter;display:flex;align-items:center;justify-content:center}
.form.sm{padding:12px 14px}.form.sm .ft{font-size:14px}
.tagn{background:#F4EFE6;color:#1E1E1E;border-radius:10px;padding:6px 14px;font:900 24px var(--mono);box-shadow:0 8px 20px rgba(0,0,0,.45);z-index:5}
.tagn.s{position:static;font-size:15px;padding:4px 8px;border-radius:7px}
.q{font:900 90px Inter;background:var(--accent);-webkit-background-clip:text;color:transparent}
.db{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.db .dt{padding:10px 14px;font:800 13px var(--mono);letter-spacing:1px;color:#fff;background:var(--panel2);border-bottom:1px solid var(--line)}
.db .dr{display:grid;grid-template-columns:1fr 1fr;padding:9px 14px;font:600 15px var(--mono);border-bottom:1px solid #303030;align-items:center}
.db .dr.three{grid-template-columns:1.1fr .7fr 1fr}
.db .dh{font:700 11px var(--mono);color:var(--muted);letter-spacing:1px}
.db.red{border-color:rgba(244,135,113,.5)}.db.red .dt{color:var(--err)}
.empty{height:26px;border:2px dashed #555;border-radius:7px}
.hashc{color:var(--teal)}.hashc.r.on{color:var(--err);background:rgba(244,135,113,.15);border-radius:6px;padding:2px 6px;margin-left:-6px}
.stamp{font:900 34px Inter;color:var(--err);border:4px solid var(--err);border-radius:10px;padding:2px 14px;transform-origin:center}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font:700 17px Inter;color:#fff}
.gwrap{width:300px;color:var(--text)}.gwrap .grind{width:100%;filter:drop-shadow(0 0 18px rgba(189,147,249,.35))}.gwrap.sm{width:200px}
.hash{background:rgba(78,201,176,.12);border:1px solid rgba(78,201,176,.45);color:var(--teal);font:700 17px var(--mono);border-radius:9px;padding:6px 10px}
.hash.b{background:rgba(189,147,249,.12);border-color:rgba(189,147,249,.5);color:var(--purple)}
.lbl{font:800 24px Inter;color:#fff}
.row3{left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;font:800 22px Inter}
.row3 .emo{font-size:44px}.row3 .arr{color:var(--muted)}.row3 .mince{background:#B4472E;color:#fff;border-radius:10px;padding:6px 12px;font-size:18px}
.row3 .x{font:900 40px Inter;color:var(--err)}
.term{background:#1A1A1A;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.term .tb{height:30px;background:var(--panel2);display:flex;align-items:center;gap:6px;padding:0 12px;font:600 11px var(--mono);color:var(--muted)}
.term .tb i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.term .tb i:nth-child(2){background:#febc2e}.term .tb i:nth-child(3){background:#28c840}.term .tb span{margin-left:8px}
.term pre{padding:14px 16px;font:600 16px/1.55 var(--mono);color:#fff;white-space:pre;min-height:300px}
.term .k{color:var(--fn)}.hashtxt{display:block;color:var(--teal);margin:4px 0 12px}.hashtxt.b{color:var(--purple)}
.cmp{left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px}.neq{font:900 36px Inter;color:var(--err)}
.eq{font:900 30px Inter;color:var(--teal)}
.ok{text-align:center;font:900 30px Inter;color:#fff}
.hacker{font-size:70px;filter:drop-shadow(0 0 20px rgba(244,135,113,.5))}
.shaker{font-size:84px;display:flex;flex-direction:column;align-items:center}.shaker b{font:800 18px var(--mono);color:var(--purple);margin-top:-6px}
.srow{left:24px;right:24px;display:flex;align-items:center;gap:9px;font:800 20px Inter;color:var(--muted);flex-wrap:nowrap}
.srow small{font:600 11px var(--mono);color:var(--muted);margin-left:auto}
.salt{background:rgba(255,121,198,.15);border:1px solid rgba(255,121,198,.5);color:var(--pink);font:700 16px var(--mono);border-radius:7px;padding:4px 8px}.salt.sm{font-size:13px;justify-self:start;padding:2px 6px}
.ok2{color:var(--teal)}
.algo{width:180px;text-align:center;background:var(--panel);border:2px solid var(--purple);border-radius:16px;padding:22px 0;font:900 30px var(--mono);color:#fff;box-shadow:0 0 30px rgba(189,147,249,.3)}
.hourg{text-align:center;font-size:90px}
.nopw{font:900 26px var(--mono);color:var(--err);border:3px solid var(--err);border-radius:10px;padding:4px 14px;text-decoration:line-through}
.bubble{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 18px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.bubble .av{font-size:30px}.bubble small{display:block;font:600 11px var(--mono);color:var(--muted)}.bubble .kw{font:900 30px Inter;color:#fff}
.pdf{width:240px;border-radius:12px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 40px rgba(189,147,249,.25)}
.dm{text-align:center;font:900 26px Inter;color:#fff}
.subbtn{display:flex;justify-content:center}.subbtn span{background:var(--accent);color:#1E1E1E;font:900 22px Inter;border-radius:999px;padding:12px 28px}
.typing::after{content:"|";color:var(--purple);margin-left:2px}
#cap{position:absolute;left:28px;right:28px;top:650px;min-height:80px;display:flex;align-items:center;justify-content:center;text-align:center;font:800 24px/1.3 Inter;color:#fff;z-index:30;text-shadow:0 2px 12px rgba(0,0,0,.8)}
#cap .w{opacity:.55}#cap .w.on{opacity:1}#cap .w.cur{opacity:1;color:var(--purple)}

.cv{position:absolute;left:0;right:0;top:150px;height:675px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.big{font:900 50px/1.02 Inter;color:#fff;text-align:center;letter-spacing:-1px}
.flow{display:flex;align-items:center;gap:10px}
</style></head><body>
