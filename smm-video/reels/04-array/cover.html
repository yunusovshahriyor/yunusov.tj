<!doctype html><html lang="tg"><head><meta charset="utf-8"><style>
:root { --paper:#F4EFE6; --ink:#1F3F44; --rust:#B4472E; --card:#FFFDF8; --line:#E3D9C7; --gold:#E9B949; --green:#3E7C59; }
* { box-sizing:border-box; margin:0; }
body { width:540px; height:960px; overflow:hidden; background:var(--paper); font-family:Inter,"DejaVu Sans",sans-serif; color:var(--ink); position:relative; }
body::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 20% 10%, rgba(255,255,255,.6), transparent 50%), radial-gradient(circle at 90% 90%, rgba(180,71,46,.07), transparent 45%); }
.hdr { position:absolute; left:26px; right:26px; top:62px; display:flex; justify-content:space-between; font:600 11px "JetBrains Mono",monospace; letter-spacing:1.5px; padding-bottom:7px; border-bottom:1.5px solid var(--rust); }
.chip { position:absolute; left:0; right:0; margin:auto; width:max-content; top:150px; background:var(--ink); color:var(--paper); font:700 15px "JetBrains Mono",monospace; letter-spacing:3px; padding:7px 14px; border-radius:6px; }
.t1 { position:absolute; left:20px; right:20px; top:196px; text-align:center; font-size:66px; font-weight:900; letter-spacing:-1.5px; }
.t2 { position:absolute; left:20px; right:20px; top:275px; text-align:center; font:900 38px "JetBrains Mono",monospace; color:var(--rust); font-variant-ligatures:none; }
.emo { font-family:"Noto Color Emoji"; }
.row { position:absolute; left:14px; right:14px; top:392px; display:flex; gap:8px; justify-content:center; }
.cell { position:relative; width:114px; height:104px; border-radius:16px; background:#C8975A; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(0,0,0,.18); }
.cell .v { background:#fff; border-radius:9px; padding:7px 10px; font-size:19px; font-weight:900; }
.cell .ix { position:absolute; top:-17px; left:50%; translate:-50% 0; background:var(--gold); font:900 18px "JetBrains Mono",monospace; min-width:36px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; }
.cell.q { background:#B4472E; } .cell.q .v { background:#fff; color:#B4472E; }
.lab { position:absolute; left:0; right:0; top:530px; text-align:center; font-size:23px; font-weight:800; }
.code { position:absolute; left:50px; right:50px; top:600px; border-radius:14px; background:#1B2A2D; box-shadow:0 14px 30px rgba(31,63,68,.25); overflow:hidden; }
.bar { height:22px; display:flex; align-items:center; gap:6px; padding:0 12px; background:rgba(255,255,255,.07); }
.bar i { width:9px; height:9px; border-radius:50%; background:#E0675A; } .bar i:nth-child(2) { background:#E9B949; } .bar i:nth-child(3) { background:#6DBE7D; }
.code p { padding:12px 18px; white-space:nowrap; font:600 17px "JetBrains Mono",monospace; color:#EDE6D8; font-variant-ligatures:none; }
.kw { color:#E0675A; } .nm { color:#E9B949; } .st { color:#7FD49A; }
</style></head><body>
<div class="hdr"><span>ШАҲРИЁР ЮНУСОВ</span><span>ДАРСИ 04 / 12</span></div>
<div class="chip">ДАРСИ 4</div>
<div class="t1">Рӯйхат чист?</div>
<div class="t2">array [ ]</div>
<div class="row">
  <div class="cell"><i class="ix">0</i><span class="v">себ</span></div>
  <div class="cell"><i class="ix">1</i><span class="v">нок</span></div>
  <div class="cell"><i class="ix">2</i><span class="v">ангур</span></div>
  <div class="cell q"><i class="ix">3</i><span class="v">?</span></div>
</div>
<div class="lab">Шумора аз <span style="color:#B4472E">0</span> оғоз мешавад! <span class="emo">☝️</span></div>
<div class="code"><div class="bar"><i></i><i></i><i></i></div><p><span class="kw">let</span> <span class="nm">fruits</span> = [<span class="st">"себ"</span>, <span class="st">"нок"</span>, <span class="st">"ангур"</span>];</p></div>
</body></html>
