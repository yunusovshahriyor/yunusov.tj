<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden}
body{background:radial-gradient(circle at 80% 22%,rgba(189,147,249,.14),transparent 42%),radial-gradient(circle at 15% 80%,rgba(0,102,0,.20),transparent 45%),#1E1E1E;color:#D4D4D4;font-family:Inter,sans-serif;position:relative}
body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:27px 27px}
.a{position:absolute}
.flag{left:0;top:0;width:100%;height:22px;display:flex;flex-direction:column}.flag i{display:block}
.flag i:nth-child(1){background:#CC0000;flex:2}.flag i:nth-child(2){background:#fff;flex:3}.flag i:nth-child(3){background:#006600;flex:2}
.safe{left:0;top:105px;width:540px;height:675px;display:flex;flex-direction:column;justify-content:center;padding:0 38px;gap:22px}
.kick{font:800 15px "DejaVu Sans Mono",monospace;letter-spacing:2px;color:#BD93F9}
.kick b{background:#2D2D30;color:#fff;border:1px solid #3C3C3C;border-radius:6px;padding:4px 9px;margin-right:9px}
h1{font-weight:900;font-size:66px;line-height:1;letter-spacing:-1.5px;color:#fff}
h1 span{background:linear-gradient(90deg,#CC0000,#fff 50%,#2fbf4f);-webkit-background-clip:text;color:transparent}
.code{background:#252526;border:1px solid #3C3C3C;border-radius:14px;padding:14px 18px;font:600 15px/1.6 "DejaVu Sans Mono",monospace;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.code .f{color:#DCDCAA}.code .s{color:#CE9178}.code .o{color:#4EC9B0;display:block;margin-top:8px;border-top:1px solid #3C3C3C;padding-top:8px}
.sub{font:700 19px Inter;color:#cfcfcf}
.sign{left:38px;bottom:40px;font:700 13px "DejaVu Sans Mono",monospace;letter-spacing:1px;color:#8B949E}.sign b{color:#fff}
</style></head><body>
<div class="a flag"><i></i><i></i><i></i></div>
<div class="a safe">
 <div class="kick"><b>6 НОЯБР</b>ҶУМҲУРИИ ТОҶИКИСТОН</div>
 <h1>Рӯзи<br><span>Конститутсия</span><br>муборак!</h1>
 <div class="code"><span class="f">console.log</span>(<span class="s">"Сулҳу ваҳдат — пойдор!"</span>);<span class="o">▶ Сулҳу ваҳдат — пойдор!</span></div>
 <div class="sub">Қонуни асосии давлати соҳибистиқлоли мо</div>
</div>
<div class="a sign"><b>ШАҲРИЁР ЮНУСОВ</b> · БАРНОМАСОЗӢ АЗ СИФР</div>
</body></html>
