<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JS IDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<meta name="description" content="Редактори код дар браузер: код нависед, иҷро кунед ва вазифаҳои дарсҳои тағйирёбанда, шарт ва давро санҷед.">
<style>
:root{--bg:#1E1E1E;--panel:#252526;--panel2:#2D2D30;--bar:#181818;--line:#3C3C3C;--text:#D4D4D4;--muted:#8B949E;--white:#FFFFFF;--kw:#569CD6;--cyan:#4FC1FF;--teal:#4EC9B0;--str:#CE9178;--num:#B5CEA8;--fn:#DCDCAA;--cm:#6A9955;--ctrl:#C586C0;--ok:#4EC9B0;--err:#F48771;--warn:#DCDCAA;--run:#2EA043;--purple:#BD93F9;--pink:#FF79C6;--accent:linear-gradient(90deg,#BD93F9,#FF79C6);--attr:#9CDCFE;--selc:#D7BA7D;--gray:#808080;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif;--mono:"JetBrains Mono","SF Mono","DejaVu Sans Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
.app{display:flex;flex-direction:column;min-height:100%}
/* ---- ҳамаи скроллбарҳо мисли VS Code ---- */
*{scrollbar-width:thin;scrollbar-color:#424242 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#424242;border-radius:5px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:#5a5a5a;background-clip:content-box;border:2px solid transparent}::-webkit-scrollbar-corner{background:transparent}
/* ---- сарлавҳа ---- */
.top{display:flex;align-items:center;gap:4px 12px;flex-wrap:wrap;padding:6px 12px;background:var(--bar);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
@media(min-width:900px){.top{height:45px;flex-wrap:nowrap;padding:0 12px}}
.logo{font:800 14px var(--mono);color:var(--white);letter-spacing:.5px;white-space:nowrap}
.logo b{background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent}
.trk{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.trk button{all:unset;cursor:pointer;font:700 11px var(--mono);padding:5px 9px;border-radius:6px;color:var(--muted);white-space:nowrap}
.trk button:hover{color:var(--text)}
.trk button.on{background:var(--panel2);color:var(--white);box-shadow:inset 0 -2px 0 var(--purple)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;min-width:0;order:3}
@media(min-width:900px){.tabs{order:0;flex:1 1 0}}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;flex:none;padding:6px 11px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab.on{color:var(--white);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--purple)}
.tab.ok::after{content:" ✓";color:var(--ok);font-weight:900}
.progress{display:flex;align-items:center;gap:10px;margin-left:auto}
.progress .pt{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}
.pbar{width:80px;height:5px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.cert{all:unset;cursor:pointer;font:700 12px var(--mono);padding:6px 12px;border-radius:999px;background:var(--accent);color:#1E1E1E;white-space:nowrap}
.cert[disabled]{opacity:.35;pointer-events:none;background:var(--line);color:var(--muted)}
/* ---- сохтор ---- */
.main{display:grid;grid-template-columns:1fr;flex:1;min-height:0}
@media(min-width:1000px){.main{grid-template-columns:minmax(300px,380px) 1fr;height:calc(100vh - 45px)}.left,.work{overflow:auto}}
.left{display:flex;flex-direction:column;gap:12px;padding:12px;border-bottom:1px solid var(--line);background:var(--bg)}
@media(min-width:1000px){.left{border-right:1px solid var(--line);border-bottom:0}}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.main.free{grid-template-columns:1fr}.main.free .left{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-size:16px;font-weight:800;color:var(--white);margin-bottom:6px}
.card p,.card li{font-size:14px;line-height:1.6;color:#cccccc}
.card ul{padding-left:18px}
.tag{display:inline-block;font:800 11px var(--mono);letter-spacing:2px;color:var(--purple);text-transform:uppercase;margin-bottom:8px}
code{font-family:var(--mono);font-variant-ligatures:none;background:var(--bg);color:var(--str);padding:1px 6px;border-radius:4px;font-size:.9em;border:1px solid var(--line)}
.card b{color:var(--white)}
/* ---- редактор: мисли VS Code ---- */
.ed{background:var(--bg);display:flex;flex-direction:column;min-height:0;flex:1}
.etabs{display:flex;align-items:stretch;height:38px;background:var(--panel);border-bottom:1px solid var(--bar);flex:none}
.ftabs{display:flex;align-items:stretch;min-width:0;overflow-x:auto;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ftab,.ftabs button{all:unset;cursor:pointer;position:relative;display:flex;align-items:center;gap:7px;padding:0 13px;font:500 13px var(--sans);color:#9d9d9d;background:var(--panel2);border-right:1px solid var(--panel);white-space:nowrap;flex:none}
.ftabs button:hover{color:#fff}
.ftab.on,.ftabs button.on{color:#fff;background:var(--bg);cursor:default}
.ftab.on::before,.ftabs button.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.ftabs button:focus-visible{outline:2px solid var(--purple);outline-offset:-2px}
.main:not(.web) .ftabs,.main.web #fname{display:none}
.fi{font:800 9px/1 var(--mono);font-style:normal;padding:3px 4px;border-radius:3px;background:rgba(255,255,255,.07)}
.fi.html{color:#e8834a}.fi.css{color:#5aa9e6}.fi.js{color:#e5c64d}
.eacts{display:flex;align-items:center;gap:4px;margin-left:auto;padding:0 8px;flex:none}
.etabs select{font:500 12px var(--sans);padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text);max-width:120px;margin-right:4px}
.etabs select option{background:var(--panel2)}
.ic{all:unset;cursor:pointer;position:relative;height:28px;min-width:28px;padding:0 7px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 12px var(--sans);color:#c5c5c5;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ic:hover{background:rgba(255,255,255,.09);color:#fff}.ic:active{transform:scale(.94)}
.ic.run{background:var(--run);color:#fff;padding:0 11px}.ic.run:hover{filter:brightness(1.12);background:var(--run)}
.ic.chk{background:var(--accent);color:#1E1E1E;padding:0 11px;font-weight:800}.ic.chk:hover{filter:brightness(1.08);background:var(--accent)}
.ic.on{background:rgba(189,147,249,.2);color:var(--purple)}
.ic:focus-visible,.btn:focus-visible,.tab:focus-visible,.sym button:focus-visible,.status button:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.ic[disabled]{opacity:.5;pointer-events:none}
.svg{flex:none}
.main.web .ic .lbl{display:none}
.ftabs .sh{display:none}
@media(min-width:1000px) and (max-width:1299px){.ftabs .lg{display:none}.ftabs .sh{display:inline}.ftabs button{padding:0 10px}.main.web #copy{display:none}}
@media(min-width:1000px) and (max-width:1149px){.ftabs .fi{display:none}}
@media(min-width:1500px){.main.web .ic .lbl{display:inline}}
.editor{position:relative;display:flex;height:clamp(230px,40vh,400px)}
@media(min-width:1000px){.editor{height:auto;flex:1;min-height:220px}}
.gut{white-space:pre;flex:none;width:54px;padding:12px 14px 12px 0;text-align:right;color:#6e7681;font:500 14px/22px var(--mono);user-select:none;overflow:hidden;background:var(--bg)}
.gut b{color:#c6c6c6;font-weight:500}
.codewrap{position:relative;flex:1;min-width:0}
.curline{position:absolute;left:0;right:0;top:0;height:22px;background:rgba(255,255,255,.05);pointer-events:none;opacity:0}
.codewrap:focus-within .curline{opacity:1}
.codewrap pre,.codewrap textarea{position:absolute;inset:0;margin:0;padding:12px 16px;font:500 14px/22px var(--mono);white-space:pre;overflow:auto;border:0;tab-size:2;letter-spacing:0;font-variant-ligatures:none}
.codewrap pre{color:#d4d4d4;pointer-events:none;overflow:hidden}
.codewrap textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;outline:none;-webkit-text-fill-color:transparent}
.codewrap textarea::selection{background:rgba(189,147,249,.35);-webkit-text-fill-color:transparent}
.kw{color:var(--kw)}.ct{color:var(--ctrl)}.st{color:var(--str)}.nu{color:var(--num)}.cm{color:var(--cm);font-style:italic}.fn{color:var(--fn)}.tp{color:var(--teal)}
.at{color:var(--attr)}.pn{color:var(--gray)}.sel{color:var(--selc)}
.status{display:flex;align-items:center;gap:16px;height:24px;padding:0 12px;background:var(--bar);border-top:1px solid var(--line);font:500 11px var(--mono);color:var(--muted);flex:none;white-space:nowrap;overflow:hidden}
.status .sp{margin-left:auto}
.status button{all:unset;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px}
.status button:hover{color:#fff;background:rgba(255,255,255,.08)}
.status button.on{color:var(--purple)}
#st-msg{color:var(--ok)}
.sym{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line)}
.sym::-webkit-scrollbar{display:none}
.sym button{all:unset;cursor:pointer;flex:none;min-width:40px;height:38px;border-radius:6px;background:var(--panel2);color:var(--text);font:700 16px var(--mono);display:flex;align-items:center;justify-content:center;padding:0 10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sym button:active{background:var(--purple);color:#1E1E1E}
.sym button.tabk{font-size:12px;color:var(--muted)}
@media(min-width:1000px){.sym{display:none}}
@media(max-width:999px){.status{display:none}}
/* ---- тугмаҳо ва майдонҳо ---- */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;font-weight:700;font-size:14px;padding:9px 14px;transition:filter .1s,transform .1s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.run{background:var(--run);color:#fff;font-size:15px;padding:10px 18px}
.btn.run:hover{filter:brightness(1.1)}
.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:13px;padding:8px 11px}
.ghost:hover{background:#37373D}
.ghost.on{border-color:var(--purple);color:var(--white);box-shadow:0 0 0 3px rgba(189,147,249,.18)}
.btn[disabled]{opacity:.5;pointer-events:none}
select{font:600 13px var(--sans);padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);max-width:100%}
/* ---- панелҳо: пешнамоиш ва консол ---- */
.phead{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px 0 14px;background:var(--panel);border-bottom:1px solid var(--bar);flex:none}
.phead .lb{font:700 11px var(--mono);letter-spacing:1.5px;color:var(--muted)}
.phead .ic{height:26px;min-width:26px;padding:0 6px}
.vsep{width:1px;height:16px;background:var(--line);margin:0 4px}
.pv{display:none;flex-direction:column;min-height:0;background:var(--bg)}
.main.web .pv{display:flex}
.pvbox{flex:1;min-height:260px;background:var(--panel2);display:flex;justify-content:center}
.pvbox iframe{border:0;background:#fff;width:100%;height:100%;min-height:260px}
.pvbox.mob iframe{width:375px;max-width:100%}
.bdg{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;border-radius:8px;font:700 9px var(--mono);display:none;align-items:center;justify-content:center;padding:0 4px;color:#1E1E1E;pointer-events:none}
.bdg.err{display:flex;background:var(--err);animation:pop .3s}.bdg.log{display:flex;background:var(--muted)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.con{background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
@media(min-width:1000px){.con{height:34%;min-height:170px}}
.main:not(.web) #conx{display:none}
.main.web .con{display:none}.main.web.con-open .con{display:flex}
.out{padding:10px 14px;min-height:150px;max-height:300px;overflow:auto;font:500 13.5px/1.6 var(--mono);color:#cccccc;white-space:pre-wrap;word-break:break-word;flex:1}
@media(min-width:1000px){.out{max-height:none}}
.out .l{display:block}.out .e{color:var(--err)}.out .i{color:var(--muted)}
.out .hint{display:block;margin-top:8px;padding:9px 12px;border-radius:6px;background:rgba(189,147,249,.10);border-left:3px solid var(--purple);color:var(--text);font:500 13.5px var(--sans)}
.out .hint code{color:var(--str)}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.checks div{font-size:13.5px;font-weight:600;padding:8px 11px;border-radius:6px;background:var(--panel2);color:var(--text)}
.checks .ok{background:rgba(78,201,176,.15);color:var(--ok)}.checks .no{background:rgba(244,135,113,.15);color:var(--err)}
.win{background:rgba(78,201,176,.15);border:1px solid rgba(78,201,176,.4);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;margin-top:10px}
.sol{margin-top:10px}
.sol pre{background:var(--bg);color:#d4d4d4;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:500 13px/1.6 var(--mono);overflow:auto;margin-top:8px;white-space:pre}
dialog{border:1px solid var(--line);border-radius:16px;padding:18px;max-width:640px;width:calc(100% - 24px);background:var(--panel);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog img{width:100%;border-radius:8px;border:1px solid var(--line);margin:10px 0}
dialog p{font-size:14px;line-height:1.5;color:#cccccc}
dialog b{color:#fff}
canvas{position:fixed;inset:0;pointer-events:none;z-index:60}
.mnav{display:none}
/* ---- ҳолати Web: редактор | пешнамоиш (консол бо пахши нишона мекушояд) ---- */
@media(min-width:1000px){
  .main.web:not(.free){grid-template-columns:minmax(280px,330px) 1fr}
  .main.web .work{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"ed pv";overflow:hidden}
  .main.web.con-open .work{grid-template-rows:minmax(0,1fr) minmax(150px,32vh);grid-template-areas:"ed pv" "ed con"}
  .main.web .ed{grid-area:ed;border-right:1px solid var(--line)}
  .main.web .pv{grid-area:pv}
  .main.web .con{grid-area:con;height:auto}
  .main.web .out{min-height:0}
}
@media(max-width:999px){
  .main.web .left,.main.web .work{display:none}
  .main.web[data-pane=lesson] .left{display:flex}
  .main.web[data-pane=code] .work,.main.web[data-pane=result] .work{display:flex}
  .main.web[data-pane=code] .pv,.main.web[data-pane=code] .con{display:none}
  .main.web[data-pane=result] .ed,.main.web[data-pane=result] .sym{display:none}
  .main.web[data-pane=result] .pvbox{min-height:55vh}
  .main.web .editor{height:clamp(280px,58vh,560px)}
  body.webmode .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  body.webmode.freemode #mn-lesson{display:none}
  .mnav button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;font:600 11px var(--sans);color:var(--muted);touch-action:manipulation}
  .mnav button.on{color:var(--white);box-shadow:inset 0 2px 0 var(--purple)}
  body.webmode .app{padding-bottom:56px}
}
@media(max-width:600px){
  .ic .lbl{display:none}.ic{height:32px;min-width:32px}
  .ftab,.ftabs button{padding:0 11px;font-size:12px}
  .etabs select{max-width:92px}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<dialog id="dlg"><h2 style="font-size:20px;font-weight:800;color:#fff">🎓 Шаҳодатнома</h2><p id="dp"></p><img id="dimg" alt="Шаҳодатнома"><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><a class="btn run" id="dl" download="shahodatnoma.png" style="text-decoration:none">⬇ Зеркашӣ</a><button class="btn ghost" id="dclose">Пӯшидан</button></div></dialog>
<div class="app">
  <header class="top">
    <span class="logo">&lt;/&gt; <b>JS</b></span>
    <div class="trk" id="trk"></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="progress"><span class="pt" id="pt" title="Вазифаҳои ҳалшуда"></span><div class="pbar"><i id="pf"></i></div><button class="cert" id="cert">🎓</button></div>
  </header>
  <div class="main">
    <aside class="left">
      <div class="card" id="side"></div>
      <div class="card" id="task" style="display:none"></div>
    </aside>
    <section class="work">
      <div class="ed">
        <div class="etabs">
          <span class="ftab on" id="fname"></span><div class="ftabs" id="ftabs"></div>
          <div class="eacts">
            <select id="ex" aria-label="Мисолҳо"></select>
            <button class="ic run" id="run" data-ic="play" title="Иҷро (Ctrl+Enter)" aria-label="Иҷро"><span class="lbl">Иҷро</span></button>
            <button class="ic chk" id="check" data-ic="check" title="Санҷиш" aria-label="Санҷиш" style="display:none"><span class="lbl">Санҷиш</span></button>
            <button class="ic" id="reset" data-ic="reset" title="Аз нав оғоз кардан" aria-label="Аз нав"></button>
            <button class="ic" id="copy" data-ic="copy" title="Нусха кардани код" aria-label="Нусха"></button>
            <button class="ic" id="share" data-ic="link" title="Пайванд барои мубодила" aria-label="Пайванд"></button>
          </div>
        </div>
        <div class="editor"><div class="gut" id="gut"></div><div class="codewrap"><div class="curline" id="curline"></div><pre id="hl" aria-hidden="true"></pre><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Редактори код"></textarea></div></div>
        <div class="status" id="status"><span id="st-pos">Сатр 1, сутун 1</span><span>Фосила: 2</span><span>UTF-8</span><span id="st-lang">JavaScript</span><span id="st-msg"></span><span class="sp"></span><button id="st-auto" title="Бастани худкори қавс, нохунак ва теғҳо">Авто-ҷуфт</button></div>
      </div>
      <div class="sym" id="sym" aria-label="Аломатҳои зуд"></div>
      <div class="pv" id="pv">
        <div class="phead"><span class="lb">ПЕШНАМОИШ</span>
          <div class="eacts"><button class="ic" id="pvdev" data-ic="phone" title="Андозаи телефон" aria-label="Андозаи телефон"></button><button class="ic" id="pvopen" data-ic="ext" title="Дар tab-и нав" aria-label="Дар tab-и нав"></button><button class="ic" id="pvdl" data-ic="dl" title="Зеркашии index.html" aria-label="Зеркашӣ"></button><span class="vsep"></span><button class="ic" id="pvcon" data-ic="term" title="Консол (натиҷа ва хатоҳо)" aria-label="Консол"><span class="bdg" id="pvbdg"></span></button></div></div>
        <div class="pvbox" id="pvbox"><iframe id="pvf" title="Пешнамоиш" sandbox="allow-scripts"></iframe></div>
      </div>
      <div class="con">
        <div class="phead"><span class="lb" id="conlbl">НАТИҶА</span>
          <div class="eacts"><button class="ic" id="clr" data-ic="trash" title="Тоза кардан" aria-label="Тоза кардан"></button><button class="ic" id="conx" data-ic="x" title="Пӯшидани консол" aria-label="Пӯшидан"></button></div></div>
        <div class="out" id="out"><span class="i">▶ Иҷро-ро пахш кунед (ё Ctrl+Enter).</span></div>
      </div>
    </section>
