<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JS IDE</title>
<meta name="description" content="Редактори код дар браузер: код нависед, иҷро кунед ва вазифаҳои дарсҳои тағйирёбанда, шарт ва давро санҷед.">
<style>
:root{--bg:#1E1E1E;--panel:#252526;--panel2:#2D2D30;--line:#3C3C3C;--text:#D4D4D4;--muted:#8B949E;--white:#FFFFFF;--kw:#569CD6;--cyan:#4FC1FF;--teal:#4EC9B0;--str:#CE9178;--num:#B5CEA8;--fn:#DCDCAA;--cm:#6A9955;--ctrl:#C586C0;--ok:#4EC9B0;--err:#F48771;--warn:#DCDCAA;--run:#2EA043;--purple:#BD93F9;--pink:#FF79C6;--accent:linear-gradient(90deg,#BD93F9,#FF79C6);--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif;--mono:"JetBrains Mono","SF Mono","DejaVu Sans Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--sans);background:radial-gradient(circle at 78% 0,rgba(189,147,249,.10),transparent 40%),radial-gradient(circle at 10% 100%,rgba(255,121,198,.05),transparent 45%),var(--bg) fixed;color:var(--text);-webkit-text-size-adjust:100%}
.app{display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{font:800 14px var(--mono);color:var(--white);letter-spacing:.5px}
.logo b{background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;min-width:0;order:3}
@media(min-width:900px){.tabs{order:0;flex:1 1 0}}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;flex:none;padding:7px 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab.on{color:var(--white);background:var(--bg);border-bottom-color:var(--purple)}
.tab.ok::after{content:" ✓";color:var(--ok);font-weight:900}
.progress{display:flex;align-items:center;gap:10px;margin-left:auto}
.progress .pt{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}
.pbar{width:90px;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.cert{all:unset;cursor:pointer;font:700 12px var(--mono);padding:6px 12px;border-radius:999px;background:var(--accent);color:#1E1E1E;white-space:nowrap}
.cert[disabled]{opacity:.35;pointer-events:none;background:var(--line);color:var(--muted)}
.main{display:grid;grid-template-columns:1fr;flex:1;min-height:0}
@media(min-width:1000px){.main{grid-template-columns:minmax(300px,380px) 1fr;height:calc(100vh - 49px)}.left,.work{overflow:auto}}
.left{display:flex;flex-direction:column;gap:12px;padding:12px;border-bottom:1px solid var(--line)}
@media(min-width:1000px){.left{border-right:1px solid var(--line);border-bottom:0}}
.work{display:flex;flex-direction:column;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-size:16px;font-weight:800;color:var(--white);margin-bottom:6px}
.card p,.card li{font-size:14px;line-height:1.6;color:#cccccc}
.card ul{padding-left:18px}
.tag{display:inline-block;font:800 11px var(--mono);letter-spacing:2px;color:var(--purple);text-transform:uppercase;margin-bottom:8px}
code{font-family:var(--mono);font-variant-ligatures:none;background:var(--bg);color:var(--str);padding:1px 6px;border-radius:4px;font-size:.9em;border:1px solid var(--line)}
.card b{color:var(--white)}
.ed{background:var(--bg);display:flex;flex-direction:column;min-height:0;flex:1}
.bar{display:flex;align-items:center;gap:6px;padding:0 12px;height:34px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar i{width:10px;height:10px;border-radius:50%;background:#ff5f57;flex:none}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar span{font:500 12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed .bar{height:42px;gap:8px}
.ed .bar #fname{margin-right:auto}
.ed .bar select{max-width:130px;padding:5px 8px;font-size:12px}
.acts{display:flex;gap:6px;flex:none}
.ic{all:unset;cursor:pointer;height:30px;min-width:32px;padding:0 9px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--text);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ic:hover{background:#37373D}.ic:active{transform:scale(.95)}
.ic.run{background:var(--run);border-color:var(--run);color:#fff}.ic.chk{background:var(--accent);border:0;color:#1E1E1E;font-size:13px;font-weight:800}
.ic:focus-visible,.btn:focus-visible,.tab:focus-visible,.sym button:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.ic[disabled]{opacity:.5;pointer-events:none}
@media(max-width:600px){.bar i.dots,.ed .bar #fname{display:none}.ed .bar select{margin-right:auto}.ic{height:34px;min-width:34px;padding:0 8px}.ic .lbl{display:none}.ed .bar{padding:0 8px;gap:6px}}
.main.free{grid-template-columns:1fr}.main.free .left{display:none}
.editor{position:relative;display:flex;height:clamp(230px,40vh,400px)}
@media(min-width:1000px){.editor{height:auto;flex:1;min-height:220px}}
.gut{white-space:pre;flex:none;width:44px;padding:12px 8px 12px 0;text-align:right;color:#858585;font:500 13.5px/1.65 var(--mono);user-select:none;overflow:hidden;background:var(--bg)}
.codewrap{position:relative;flex:1;min-width:0}
.codewrap pre,.codewrap textarea{position:absolute;inset:0;margin:0;padding:12px 14px;font:500 14px/1.65 var(--mono);white-space:pre;overflow:auto;border:0;tab-size:2;letter-spacing:0;font-variant-ligatures:none}
.codewrap pre{color:#d4d4d4;pointer-events:none;overflow:hidden}
.codewrap textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;outline:none;-webkit-text-fill-color:transparent}
.codewrap textarea::selection{background:rgba(189,147,249,.35);-webkit-text-fill-color:transparent}
.kw{color:var(--kw)}.ct{color:var(--ctrl)}.st{color:var(--str)}.nu{color:var(--num)}.cm{color:var(--cm);font-style:italic}.fn{color:var(--fn)}.tp{color:var(--teal)}
.sym{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line)}
.sym::-webkit-scrollbar{display:none}
.sym button{all:unset;cursor:pointer;flex:none;min-width:40px;height:38px;border-radius:6px;background:var(--panel2);color:var(--text);font:700 16px var(--mono);display:flex;align-items:center;justify-content:center;padding:0 10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sym button:active{background:var(--purple);color:#1E1E1E}
.sym button.tabk{font-size:12px;color:var(--muted)}
@media(min-width:1000px){.sym{display:none}}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;font-weight:700;font-size:14px;padding:9px 14px;transition:filter .1s,transform .1s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.run{background:var(--run);color:#fff;font-size:15px;padding:10px 18px}
.btn.run:hover,.ic.run:hover,.ic.chk:hover{filter:brightness(1.1)}
.btn.chk{background:var(--accent);color:#1E1E1E;font-size:15px;padding:10px 16px}
.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:13px;padding:8px 11px}
.ghost:hover{background:#37373D}
.ghost.on{border-color:var(--purple);color:var(--white);box-shadow:0 0 0 3px rgba(189,147,249,.18)}
.btn[disabled]{opacity:.5;pointer-events:none}
select{font:600 13px var(--sans);padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);max-width:100%}
.con{background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column}
@media(min-width:1000px){.con{height:34%;min-height:170px}}
.con .bar{height:32px}
.con .bar span{margin:0;font:700 11px var(--mono);letter-spacing:1.5px;color:var(--muted)}
.con .bar button{margin-left:auto}
.out{padding:10px 14px;min-height:150px;max-height:300px;overflow:auto;font:500 13.5px/1.6 var(--mono);color:#cccccc;white-space:pre-wrap;word-break:break-word;flex:1}
@media(min-width:1000px){.out{max-height:none}}
.out .l{display:block}.out .e{color:var(--err)}.out .i{color:var(--muted)}
.out .hint{display:block;margin-top:8px;padding:9px 12px;border-radius:6px;background:rgba(189,147,249,.10);border-left:3px solid var(--purple);color:var(--text);font:500 13.5px var(--sans)}
.out .hint code{color:var(--str)}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.checks div{font-size:13.5px;font-weight:600;padding:8px 11px;border-radius:6px;background:var(--panel2);color:var(--text)}
.checks .ok{background:rgba(78,201,176,.15);color:var(--ok)}.checks .no{background:rgba(244,135,113,.15);color:var(--err)}
.win{background:rgba(78,201,176,.15);border:1px solid rgba(78,201,176,.4);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;margin-top:10px}
.sol{margin-top:10px}
.sol pre{background:var(--bg);color:#d4d4d4;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:500 13px/1.6 var(--mono);overflow:auto;margin-top:8px;white-space:pre}
dialog{border:1px solid var(--line);border-radius:16px;padding:18px;max-width:640px;width:calc(100% - 24px);background:var(--panel);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog img{width:100%;border-radius:8px;border:1px solid var(--line);margin:10px 0}
dialog p{font-size:14px;line-height:1.5;color:#cccccc}
dialog b{color:#fff}
canvas{position:fixed;inset:0;pointer-events:none;z-index:60}
/* ---- трекҳо, таби файлҳо ва пешнамоиш (ҳолати Web) ---- */
:root{--attr:#9CDCFE;--selc:#D7BA7D;--gray:#808080}
.at{color:var(--attr)}.pn{color:var(--gray)}.sel{color:var(--selc)}
.trk{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.trk button{all:unset;cursor:pointer;font:700 11px var(--mono);padding:5px 9px;border-radius:6px;color:var(--muted);white-space:nowrap}
.trk button:hover{color:var(--text)}
.trk button.on{background:var(--panel2);color:var(--white);box-shadow:inset 0 -2px 0 var(--purple)}
.main.web .ed .bar i.dots,.main.web .ic .lbl{display:none}
.main.web .ed .bar{gap:6px;padding:0 8px}.main.web .ed .acts{gap:4px}
.ftabs{display:none;gap:2px;margin-right:auto;align-self:stretch;align-items:flex-end}
.main.web .ftabs{display:flex}.main.web #fname{display:none}
.ftabs button{all:unset;cursor:pointer;font:700 12px var(--mono);padding:8px 12px;border-radius:6px 6px 0 0;color:var(--muted)}
.ftabs button:hover{color:var(--text)}
.ftabs button.on{color:var(--white);background:var(--bg);box-shadow:inset 0 -2px 0 var(--purple)}
.ftabs button:focus-visible{outline:2px solid var(--purple);outline-offset:-2px}
.pv{display:none;flex-direction:column;min-height:0;background:var(--bg);border-top:1px solid var(--line)}
.main.web .pv{display:flex}
.pv .bar{height:32px}
.pv .bar span{margin:0;font:700 11px var(--mono);letter-spacing:1.5px;color:var(--muted)}
.pv .ic{height:24px;min-width:28px;padding:0 6px;font-size:13px}
.pvbox{flex:1;min-height:260px;background:var(--panel2);display:flex;justify-content:center}
.pvbox iframe{border:0;background:#fff;width:100%;height:100%;min-height:260px}
.pvbox.mob iframe{width:375px;max-width:100%}
.mnav{display:none}
@media(min-width:1000px){
  .main.web .work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(140px,30vh);grid-template-areas:"ed pv" "ed con";overflow:hidden}
  .main.web .ed{grid-area:ed;border-right:1px solid var(--line)}
  .main.web .pv{grid-area:pv;border-top:0}
  .main.web .con{grid-area:con;height:auto;min-height:0}
  .main.web .out{min-height:0}
}
@media(max-width:999px){
  .main.web .left,.main.web .work{display:none}
  .main.web[data-pane=lesson] .left{display:flex}
  .main.web[data-pane=code] .work,.main.web[data-pane=result] .work{display:flex}
  .main.web[data-pane=code] .pv,.main.web[data-pane=code] .con{display:none}
  .main.web[data-pane=result] .ed,.main.web[data-pane=result] .sym{display:none}
  .main.web[data-pane=result] .pvbox{min-height:55vh}
  .main.web .editor{height:clamp(280px,58vh,560px)}
  .main.web .ed .bar{height:auto;min-height:42px;flex-wrap:wrap;padding-top:4px;padding-bottom:4px}
  .main.web .ed .bar .ftabs{order:5;flex:1 1 100%}
  body.webmode .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  body.webmode.freemode #mn-lesson{display:none}
  .mnav button{all:unset;cursor:pointer;flex:1;text-align:center;padding:13px 4px;font:700 13px var(--sans);color:var(--muted);touch-action:manipulation}
  .mnav button.on{color:var(--white);box-shadow:inset 0 2px 0 var(--purple)}
  body.webmode .app{padding-bottom:52px}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<dialog id="dlg"><h2 style="font-size:20px;font-weight:800;color:#fff">🎓 Шаҳодатнома</h2><p id="dp"></p><img id="dimg" alt="Шаҳодатнома"><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><a class="btn run" id="dl" download="shahodatnoma.png" style="text-decoration:none">⬇ Зеркашӣ</a><button class="btn ghost" id="dclose">Пӯшидан</button></div></dialog>
<div class="app">
  <header class="top">
    <span class="logo">&lt;/&gt; <b>JS</b></span>
    <div class="trk" id="trk"></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="progress"><span class="pt" id="pt"></span><div class="pbar"><i id="pf"></i></div><button class="cert" id="cert">🎓</button></div>
  </header>
  <div class="main">
    <aside class="left">
      <div class="card" id="side"></div>
      <div class="card" id="task" style="display:none"></div>
    </aside>
    <section class="work">
      <div class="ed">
        <div class="bar"><i class="dots"></i><i class="dots"></i><i class="dots"></i><select id="ex" aria-label="Мисолҳо"></select><span id="fname">main.js</span><div class="ftabs" id="ftabs"></div>
          <div class="acts"><button class="ic run" id="run" title="Иҷро (Ctrl+Enter)" aria-label="Иҷро">▶</button><button class="ic chk" id="check" title="Санҷиш" aria-label="Санҷиш" style="display:none">✓ <span class="lbl">Санҷиш</span></button><button class="ic" id="reset" title="Аз нав" aria-label="Аз нав">↺</button><button class="ic" id="copy" title="Нусха" aria-label="Нусха">📋</button><button class="ic" id="share" title="Пайванд" aria-label="Пайванд">🔗</button></div></div>
        <div class="editor"><div class="gut" id="gut"></div><div class="codewrap"><pre id="hl" aria-hidden="true"></pre><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Редактори код"></textarea></div></div>
      </div>
      <div class="sym" id="sym" aria-label="Аломатҳои зуд"></div>
      <div class="pv" id="pv"><div class="bar"><span>ПЕШНАМОИШ</span><div class="acts" style="margin-left:auto"><button class="ic" id="pvdev" title="Андозаи телефон" aria-label="Андозаи телефон">📱</button><button class="ic" id="pvopen" title="Дар tab-и нав" aria-label="Дар tab-и нав">↗</button><button class="ic" id="pvdl" title="Зеркашии index.html" aria-label="Зеркашӣ">⬇</button></div></div><div class="pvbox" id="pvbox"><iframe id="pvf" title="Пешнамоиш" sandbox="allow-scripts"></iframe></div></div>
      <div class="con"><div class="bar"><span id="conlbl">НАТИҶА</span><button class="btn ghost" id="clr" style="padding:3px 9px;font-size:12px">тоза</button></div><div class="out" id="out"><span class="i">▶ Иҷро-ро пахш кунед (ё Ctrl+Enter).</span></div></div>
    </section>
  </div>
</div>
<nav class="mnav" id="mnav" aria-label="Қисмҳо"><button data-p="lesson" id="mn-lesson">📖 Дарс</button><button data-p="code">✏️ Код</button><button data-p="result">👁 Натиҷа</button></nav>

<script src="lessons/js.js"></script>
<script src="lessons/web.js"></script>
<script>

  function doRun() {

  }

  $("copy").onclick = function () { var b = this; (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(function () { b.textContent = "✓"; }, function () { ta.select(); try { document.execCommand("copy"); b.textContent = "✓"; } catch (e) {} }).then(function () { setTimeout(function () { b.textContent = "📋"; }, 1500); }); };
  $("ex").onchange = function () {

  $("mnav").onclick = function (e) { var p = e.target.getAttribute && e.target.getAttribute("data-p"); if (p) setPane(p); };

  $("check").onclick = function () {

      ? runWebChecks(t.checks).then(function (res) { return res ? t.checks.map(function (c, i) { return [c.label, !!res[i]]; }) : [["Саҳифа бор нашуд — дубора кӯшиш кунед", false]]; })

      if (all) { done[L.id + "-" + ti] = 1; ls("done", JSON.stringify(done)); $("winbox").innerHTML = '<div class="win">🎉 Офарин! Вазифа ҳал шуд.' + (ti < L.tasks.length - 1 ? " Вазифаи навбатӣ: тугмаи «" + (ti + 2) + "» дар тарафи рост." : " Ба дарси навбатӣ гузаред!") + "</div>"; confetti(); drawTabs(); drawProgress(); }
      else $("winbox").innerHTML = "";
      $("check").disabled = false;
      if (isWeb()) { setPane("lesson"); $("task").scrollIntoView({ block: "nearest" }); }
    });
  };

  /* ---------- конфетти ---------- */
  var cv = $("fx"), cx = cv.getContext("2d"), parts = [], on = false;
  function fit() { cv.width = innerWidth; cv.height = innerHeight; } addEventListener("resize", fit); fit();
  function confetti() { var c = ["#BD93F9", "#FF79C6", "#4EC9B0", "#DCDCAA"]; for (var i = 0; i < 100; i++) parts.push({ x: innerWidth / 2, y: innerHeight * .3, vx: (Math.random() - .5) * 13, vy: -Math.random() * 12 - 3, s: Math.random() * 8 + 4, c: c[i % 4], r: 0, vr: (Math.random() - .5) * .4 }); if (!on) { on = true; requestAnimationFrame(tick); } }
  function tick() { cx.clearRect(0, 0, cv.width, cv.height); parts = parts.filter(function (p) { return p.y < cv.height + 20; }); parts.forEach(function (p) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6); cx.restore(); }); if (parts.length) requestAnimationFrame(tick); else { on = false; cx.clearRect(0, 0, cv.width, cv.height); } }


  /* ---------- пешравӣ ва шаҳодатнома ---------- */
  function totals(tk) { var n = 0, d = 0; LESSONS.forEach(function (L) { if (!L.free && L.track === tk) L.tasks.forEach(function (_, i) { n++; if (done[L.id + "-" + i]) d++; }); }); return [d, n]; }
  function drawProgress() {
    var tk = track(), t = totals(tk), pct = t[1] ? Math.round(100 * t[0] / t[1]) : 0;
    $("pt").textContent = "✓ " + t[0] + " аз " + t[1] + " вазифа"; $("pf").style.width = pct + "%";
    $("cert").style.display = TRACKS[tk].cert ? "" : "none";
    $("cert").disabled = t[0] < t[1]; $("cert").title = t[0] < t[1] ? "Баъд аз ҳалли ҳамаи вазифаҳо" : "";
    $("cert").textContent = t[0] < t[1] ? "🎓 Шаҳодатнома" : "🎓 Шаҳодатнома гиред!";
  }
  function makeCert(name) {

    x.fillStyle = "#1E1E1E"; x.fillRect(0, 0, 1600, 1130);
    var gl = x.createRadialGradient(1250, 280, 0, 1250, 280, 640); gl.addColorStop(0, "rgba(189,147,249,.18)"); gl.addColorStop(1, "rgba(189,147,249,0)"); x.fillStyle = gl; x.fillRect(0, 0, 1600, 1130);
    x.strokeStyle = g(40, 1560); x.lineWidth = 8; x.strokeRect(40, 40, 1520, 1050); x.strokeStyle = "#3C3C3C"; x.lineWidth = 3; x.strokeRect(62, 62, 1476, 1006);
    x.textAlign = "center"; var F = "Inter, 'DejaVu Sans', Arial, sans-serif";
    x.fillStyle = "#BD93F9"; x.font = "800 30px 'DejaVu Sans Mono', monospace"; x.fillText("ШАҲРИЁР ЮНУСОВ · БАРНОМАСОЗӢ АЗ СИФР", 800, 170);
    x.fillStyle = "#FFFFFF"; x.font = "900 110px " + F; x.fillText("ШАҲОДАТНОМА", 800, 330);
    x.font = "600 38px " + F; x.fillStyle = "#8B949E"; x.fillText("Ин шаҳодатнома ба", 800, 450);
    x.font = "900 88px " + F; var nm = name || "Донишҷӯ"; while (x.measureText(nm).width > 1300 && nm.length > 3) nm = nm.slice(0, -1); x.fillStyle = g(800 - x.measureText(nm).width / 2, 800 + x.measureText(nm).width / 2); x.fillText(nm, 800, 580);
    x.fillStyle = "#3C3C3C"; x.fillRect(420, 615, 760, 4);
    x.fillStyle = "#D4D4D4"; x.font = "600 40px " + F; x.fillText("ҳамаи вазифаҳои курси «Барномасозӣ аз сифр»-ро иҷро кард:", 800, 700);
    x.font = "800 36px " + F; x.fillStyle = "#4EC9B0"; x.fillText("Тағйирёбанда · Шарт · Давр · Рӯйхат · Функсия · Объект · Дебаг", 800, 770);
    x.fillStyle = "#8B949E"; x.font = "600 30px " + F; var d = new Date(); x.fillText(d.getDate() + "." + (d.getMonth() + 1) + "." + d.getFullYear(), 800, 880);
    x.fillStyle = "#FFFFFF"; x.font = "800 34px " + F; x.fillText("@shahriyor_yunusov", 800, 970);
    x.beginPath(); x.arc(1400, 930, 70, 0, 7); x.fillStyle = g(1330, 1470); x.fill(); x.fillStyle = "#1E1E1E"; x.font = "900 58px " + F; x.fillText("</>", 1400, 950);
    return cv2.toDataURL("image/png");
  }
  $("cert").onclick = function () {
    var nm = ls("name") || ""; var v = prompt("Номи худро нависед (барои шаҳодатнома):", nm); if (v === null) return; v = v.trim(); ls("name", v);
    var url = makeCert(v); $("dimg").src = url; $("dl").href = url;
    $("dp").innerHTML = "Офарин! 🎉 Шаҳодатномаро зеркашӣ кунед ва ба <b>сторис</b> гузоред: <b>@shahriyor_yunusov</b>-ро қайд кунед!"; $("dlg").showModal(); confetti();
  };
  $("dclose").onclick = function () { $("dlg").close(); };

  /* ---------- пайвандҳо ба дарс ва нусхаи код ---------- */
  function setHash() {
    var L = lesson(), h = L.free ? (L.track === "web" ? "#web" : "#free") : "#dars-" + L.id.slice(1) + (ti ? "-" + (ti + 1) : "");
    try { history.replaceState(null, "", h); } catch (e) {}
  }
  function b64u(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function unb64u(b) { b = b.replace(/-/g, "+").replace(/_/g, "/"); while (b.length % 4) b += "="; return decodeURIComponent(escape(atob(b))); }
  function parseHash() {
    var h = location.hash || "", m;
    if ((m = /^#code=(.+)$/.exec(h))) { try { cur = "free"; ls("code-free", unb64u(m[1])); return; } catch (e) {} }
    if ((m = /^#web=(.+)$/.exec(h))) {
      try { var o = JSON.parse(unb64u(m[1])); cur = "webfree"; pane = "code"; FILES.forEach(function (f) { if (typeof o[f] === "string") ls("code-webfree-" + f, o[f]); }); return; } catch (e) {}
    }
    if ((m = /^#dars-(\d+)(?:-(\d+))?$/.exec(h))) { var id = "l" + m[1]; if (LESSONS.some(function (L) { return L.id === id; })) { cur = id; ti = Math.max(0, (+m[2] || 1) - 1); var L = lesson(); if (ti >= L.tasks.length) ti = 0; ls("tab", cur); return; } }
    if (h === "#free") cur = "free";
    if (h === "#web") { cur = "webfree"; pane = "code"; }
  }
  $("share").onclick = function () {
    var b = this, u = location.href.split("#")[0] + (isWeb() ? "#web=" + b64u(JSON.stringify({ html: files.html || "", css: files.css || "", js: files.js || "" })) : "#code=" + b64u(ta.value));
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { b.textContent = "✓"; }, function () { prompt("Пайвандро нусха кунед:", u); }).then(function () { setTimeout(function () { b.textContent = "🔗"; }, 1800); });
  };

  var SYMS = {
    js: [["⇥", "  ", "tab"], ["{", "{}"], ["}", "}"], ["(", "()"], [")", ")"], ["[", "[]"], ["]", "]"], [";", ";"], ['"', '""'], ["=", "="], ["+", "+"], ["-", "-"], ["<", "<"], [">", ">"], ["!", "!"], ["/", "/"], [".", "."], [",", ","]],
    html: [["⇥", "  ", "tab"], ["<", "<"], [">", ">"], ["</", "</"], ["/>", "/>"], ["=", "="], ['"', '""'], ["#", "#"], [".", "."], ["-", "-"], ["!", "!"], ["&", "&"], [";", ";"]],
    css: [["⇥", "  ", "tab"], ["{", "{}"], ["}", "}"], [":", ":"], [";", ";"], ["#", "#"], [".", "."], ["%", "%"], ["(", "()"], [")", ")"], [",", ","], ['"', '""'], ["-", "-"], ["/", "/"], ["*", "*"]]
  };

      var b = document.createElement("button"); b.textContent = sy[0]; if (sy[2]) b.className = "tabk"; b.setAttribute("aria-label", "Аломат " + sy[0]);
      b.addEventListener("pointerdown", function (e) {

        ta.value = ta.value.slice(0, s0) + ins + ta.value.slice(e0);
        var pos = s0 + (ins.length === 2 && ins !== "  " && /[\{\(\[\"]/.test(ins[0]) ? 1 : ins.length);

      });

    });
  }

  window.__ide = { lessons: LESSONS, setCode: function (c, f) { f = f || curFile; files[f] = c; if (f === curFile) { ta.value = c; paint(); } schedulePreview(); }, goto: function (id, i) { cur = id; ti = i || 0; pane = "code"; load(); } };
  pane = "lesson"; parseHash(); if (lesson().free) pane = "code"; load();
  addEventListener("hashchange", function () { var o = cur + ti; parseHash(); if (cur + ti !== o) load(); });
})();
